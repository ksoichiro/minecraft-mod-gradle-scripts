// Production run support for testing built Mod JARs in a near-production environment.
// Supports Fabric and NeoForge loaders (Forge < 50 is unsupported, see below).
//
// Usage:
//   ./gradlew :fabric:runProd -Ptarget_mc_version=1.21.1
//   ./gradlew :neoforge:runProd -Ptarget_mc_version=1.21.1
//
// Headless world-creation smoke test (no display required; recommended after
// Mixin config changes or when adding a new Minecraft version, see CLAUDE.md
// "Mixin Configuration" / "Multi-Version Support"):
//   ./gradlew :fabric:prodSmokeTest -Ptarget_mc_version=1.21.1
//   ./gradlew :neoforge:prodSmokeTest -Ptarget_mc_version=1.21.1
//
// Optional project properties:
//   prod_base_dir        - Base directory for production run files (default: ${rootDir}/run-prod)
//   release_project_name - Project display name for task groups (defaults to project.name)
//
// prodSmokeTest uses a build-relative directory (build/prod-smoke/<loader>-<version>),
// separate from prod_base_dir, so it never touches manually-verified runProd state.
// It is cleaned up by clean<version>/cleanAll like any other build output.

import groovy.json.JsonSlurper

// --- Configuration ---
def prodBaseDir = project.findProperty('prod_base_dir') ?: "${rootDir}/run-prod"
def prodCacheDir = "${prodBaseDir}/cache"
def mcVersion = project.findProperty('minecraft_version')
def taskGroupName = (project.findProperty('release_project_name') ?: project.name).toString().toLowerCase() + ' prod'

// --- Helper: Download file with caching ---
// Skips download if file already exists. Delete run-prod/cache/ to force re-download.
ext.prodDownloadFile = { String url, File dest ->
    if (dest.exists()) return
    dest.parentFile.mkdirs()
    logger.lifecycle("  Downloading: ${dest.name}")
    ant.get(src: url, dest: dest, verbose: false)
}

// --- Helper: Get current OS name for Mojang manifest rules ---
ext.prodGetMojangOs = {
    def osName = System.getProperty('os.name').toLowerCase()
    if (osName.contains('mac')) return 'osx'
    if (osName.contains('win')) return 'windows'
    return 'linux'
}

// --- Helper: Check if a library passes Mojang OS rules ---
ext.prodIsLibraryAllowed = { lib ->
    if (!lib.rules) return true
    def allowed = false
    def currentOs = prodGetMojangOs()
    lib.rules.each { rule ->
        def osMatch = true
        if (rule.os) {
            osMatch = (rule.os.name == currentOs)
            if (osMatch && rule.os.arch) {
                osMatch = (rule.os.arch == System.getProperty('os.arch'))
            }
        }
        if (osMatch) {
            allowed = (rule.action == 'allow')
        }
    }
    return allowed
}

// --- Helper: Parse and cache Mojang version JSON ---
ext.prodGetVersionJson = { String version ->
    def manifestFile = file("${prodCacheDir}/manifest/version_manifest_v2.json")
    prodDownloadFile('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json', manifestFile)

    def manifest = new JsonSlurper().parse(manifestFile)
    def versionEntry = manifest.versions.find { it.id == version }
    if (!versionEntry) {
        throw new GradleException("Minecraft version ${version} not found in Mojang manifest. " +
            "Delete ${manifestFile} to refresh.")
    }

    def versionFile = file("${prodCacheDir}/versions/${version}.json")
    prodDownloadFile(versionEntry.url, versionFile)
    return new JsonSlurper().parse(versionFile)
}

// --- Helper: Collect library files for the current platform ---
ext.prodGetLibraryFiles = { versionJson ->
    def librariesDir = file("${prodCacheDir}/libraries")
    def files = []
    versionJson.libraries.each { lib ->
        if (!prodIsLibraryAllowed(lib)) return
        if (lib.downloads?.artifact) {
            def f = file("${librariesDir}/${lib.downloads.artifact.path}")
            if (f.exists()) files.add(f)
        }
    }
    return files
}

// --- Helper: Convert Maven coordinate to relative path ---
// Supports classifier (group:artifact:version:classifier) and @ext notation.
// e.g. "org.ow2.asm:asm:9.9" -> "org/ow2/asm/asm/9.9/asm-9.9.jar"
// e.g. "net.neoforged:mergetool:2.0.0:api" -> "net/neoforged/mergetool/2.0.0/mergetool-2.0.0-api.jar"
// e.g. "com.example:lib:1.0@zip" -> "com/example/lib/1.0/lib-1.0.zip"
ext.prodMavenCoordToPath = { String coord ->
    def extension = 'jar'
    def coordBody = coord
    if (coord.contains('@')) {
        extension = coord.substring(coord.indexOf('@') + 1)
        coordBody = coord.substring(0, coord.indexOf('@'))
    }
    def parts = coordBody.split(':')
    def group = parts[0]
    def artifact = parts[1]
    def version = parts[2]
    def classifier = parts.length > 3 ? parts[3] : null
    def filename = classifier
        ? "${artifact}-${version}-${classifier}.${extension}"
        : "${artifact}-${version}.${extension}"
    return "${group.replace('.', '/')}/${artifact}/${version}/${filename}"
}

// --- Helper: Fetch and cache Fabric Loader profile from Meta API ---
ext.prodGetFabricProfile = { String gameVersion, String loaderVersion ->
    def profileFile = file("${prodCacheDir}/fabric-profile/${gameVersion}-${loaderVersion}.json")
    prodDownloadFile(
        "https://meta.fabricmc.net/v2/versions/loader/${gameVersion}/${loaderVersion}/profile/json",
        profileFile
    )
    return new JsonSlurper().parse(profileFile)
}

// --- Helper: Find loader version JSON in install directory ---
// Searches installDir/versions/ for a non-vanilla version JSON (used by installer-based loaders).
ext.prodFindLoaderVersionJson = { File installDir, String vanillaVersion ->
    def versionsDir = new File(installDir, 'versions')
    if (!versionsDir.exists()) return null
    File found = null
    versionsDir.eachDir { dir ->
        if (dir.name != vanillaVersion) {
            def jsonFile = new File(dir, "${dir.name}.json")
            if (jsonFile.exists()) found = jsonFile
        }
    }
    return found
}

// --- Helper: Merge loader version JSON with vanilla JSON (inheritsFrom processing) ---
ext.prodMergeVersionJsons = { loaderJson, vanillaJson ->
    def merged = [:]
    merged.mainClass = loaderJson.mainClass
    merged.libraries = []
    if (loaderJson.libraries) merged.libraries.addAll(loaderJson.libraries)
    if (vanillaJson.libraries) merged.libraries.addAll(vanillaJson.libraries)
    merged.arguments = [jvm: [], game: []]
    if (loaderJson.arguments?.jvm) merged.arguments.jvm.addAll(loaderJson.arguments.jvm)
    if (vanillaJson.arguments?.jvm) merged.arguments.jvm.addAll(vanillaJson.arguments.jvm)
    if (loaderJson.arguments?.game) merged.arguments.game.addAll(loaderJson.arguments.game)
    if (vanillaJson.arguments?.game) merged.arguments.game.addAll(vanillaJson.arguments.game)
    return merged
}

// --- Helper: Evaluate argument rules from version JSON ---
// Returns true if the argument should be included. Feature-gated args are excluded.
ext.prodEvalArgumentRules = { rules ->
    if (!rules) return true
    def currentOs = prodGetMojangOs()
    def allowed = false
    for (rule in rules) {
        // Skip feature-gated args (e.g., demo mode, custom resolution)
        if (rule.features) return false
        def osMatch = true
        if (rule.os) {
            osMatch = (rule.os.name == currentOs)
            if (osMatch && rule.os.arch) {
                osMatch = System.getProperty('os.arch').contains(rule.os.arch)
            }
        }
        if (osMatch) {
            allowed = (rule.action == 'allow')
        }
    }
    return allowed
}

// --- Helper: Substitute placeholder strings ---
ext.prodSubstitutePlaceholders = { String str, Map<String, String> placeholders ->
    def result = str
    placeholders.each { key, value ->
        result = result.replace(key, value)
    }
    return result
}

// --- Helper: Extract native libraries from classifier JARs ---
// For MC versions using the old natives system (pre-1.19), extracts platform-specific
// native libraries (.dylib, .dll, .so) from classifier JARs to the specified directory.
// On macOS ARM64, LWJGL < 3.3.1 doesn't ship ARM64 natives, so this helper
// downloads LWJGL 3.3.1 ARM64 natives from Maven Central as a replacement.
ext.prodExtractNatives = { versionJson, File nativesDir ->
    def librariesDir = file("${prodCacheDir}/libraries")
    def currentOs = prodGetMojangOs()
    def isArm64Mac = (currentOs == 'osx' && System.getProperty('os.arch') == 'aarch64')
    def lwjglArm64Modules = [] as Set

    versionJson.libraries.each { lib ->
        if (!prodIsLibraryAllowed(lib)) return
        if (!lib.natives) return

        def nativeClassifier = lib.natives[currentOs]
        if (!nativeClassifier) return

        nativeClassifier = nativeClassifier.replace('${arch}',
            System.getProperty('os.arch') == 'aarch64' ? 'arm64' : '64')

        def nativeArtifact = lib.downloads?.classifiers?.get(nativeClassifier)
        if (!nativeArtifact) return

        // On ARM64 Mac, collect old LWJGL modules for later ARM64 native patching
        if (isArm64Mac && lib.name?.startsWith('org.lwjgl')) {
            def parts = lib.name.split(':')
            if (parts.length >= 3) {
                def version = parts[2]
                if (version.startsWith('3.2.') || version == '3.3.0') {
                    lwjglArm64Modules.add(parts[1])
                    return // Skip extracting x86_64 natives; ARM64 patch below will handle it
                }
            }
        }

        def nativeJar = new File(librariesDir, nativeArtifact.path)
        if (!nativeJar.exists()) return

        def excludePatterns = lib.extract?.exclude ?: []

        ant.unzip(src: nativeJar, dest: nativesDir) {
            patternset {
                excludePatterns.each { p ->
                    exclude(name: "${p}**")
                }
            }
        }
    }

    // Download and extract LWJGL 3.3.1 ARM64 natives for old MC versions on Apple Silicon
    if (!lwjglArm64Modules.isEmpty()) {
        def lwjglArm64Version = '3.3.1'
        def arm64CacheDir = file("${prodCacheDir}/lwjgl-arm64")

        lwjglArm64Modules.each { module ->
            def path = "org/lwjgl/${module}/${lwjglArm64Version}/${module}-${lwjglArm64Version}-natives-macos-arm64.jar"
            def dest = new File(arm64CacheDir, path)
            prodDownloadFile("https://repo1.maven.org/maven2/${path}", dest)

            if (dest.exists()) {
                // Extract to temp dir, then flatten .dylib files to natives root.
                // LWJGL 3.3.1 JARs use nested paths (macos/arm64/org/lwjgl/...)
                // but LWJGL 3.2.x expects flat .dylib files in java.library.path.
                def tempDir = new File(nativesDir, '.arm64-extract-tmp')
                ant.unzip(src: dest, dest: tempDir) {
                    patternset {
                        exclude(name: 'META-INF/**')
                    }
                }
                tempDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    if (f.name.endsWith('.dylib')) {
                        ant.copy(file: f, todir: nativesDir, overwrite: true)
                    }
                }
                ant.delete(dir: tempDir)
            }
        }
        logger.lifecycle("  Patched ${lwjglArm64Modules.size()} LWJGL modules with ARM64 natives")
    }
}

// --- Helper: Replace LWJGL < 3.3.1 JARs with 3.3.1 ARM64 versions on the classpath ---
// On macOS ARM64, old LWJGL versions lack ARM64 support. This helper replaces both
// the API JARs and adds native JARs on the classpath so versions match.
ext.prodPatchLwjglForArm64 = { List<File> classpathFiles ->
    if (prodGetMojangOs() != 'osx' || System.getProperty('os.arch') != 'aarch64') {
        return classpathFiles
    }

    // Detect old LWJGL API JARs (e.g., lwjgl-3.2.1.jar, lwjgl-glfw-3.2.1.jar)
    def oldLwjglPattern = ~/^(lwjgl(?:-[a-z]+)*)-3\.(?:2\.\d+|3\.0)\.jar$/
    def modulesToReplace = [] as Set
    classpathFiles.each { f ->
        def m = oldLwjglPattern.matcher(f.name)
        if (m.matches()) {
            modulesToReplace.add(m.group(1))
        }
    }

    if (modulesToReplace.isEmpty()) return classpathFiles

    def lwjglVersion = '3.3.1'
    def arm64CacheDir = file("${prodCacheDir}/lwjgl-arm64")

    // Filter out all old LWJGL JARs (API + native classifier JARs)
    def filtered = classpathFiles.findAll { f ->
        !(f.name.startsWith('lwjgl') && (f.name.contains('-3.2.') || f.name.contains('-3.3.0')))
    }

    // Add LWJGL 3.3.1 API JARs as replacements
    modulesToReplace.each { module ->
        def apiPath = "org/lwjgl/${module}/${lwjglVersion}/${module}-${lwjglVersion}.jar"
        def apiDest = new File(arm64CacheDir, apiPath)
        prodDownloadFile("https://repo1.maven.org/maven2/${apiPath}", apiDest)
        if (apiDest.exists()) filtered.add(apiDest)
    }

    logger.lifecycle("  Replaced ${modulesToReplace.size()} LWJGL modules with ${lwjglVersion} for ARM64: ${modulesToReplace}")
    return filtered
}

// --- Helper: Process arguments list from version JSON ---
// Evaluates rules, substitutes placeholders, skips -cp/${classpath} (handled by JavaExec).
ext.prodProcessArguments = { List argsList, Map<String, String> placeholders ->
    def result = []
    def skipNext = false
    for (int i = 0; i < argsList.size(); i++) {
        if (skipNext) { skipNext = false; continue }
        def arg = argsList[i]
        if (arg instanceof Map) {
            if (!prodEvalArgumentRules(arg.rules)) continue
            def values = arg.value instanceof List ? arg.value : [arg.value]
            values.each { v ->
                def s = prodSubstitutePlaceholders(v.toString(), placeholders)
                if (s != '${classpath}') result.add(s)
            }
        } else {
            def s = arg.toString()
            if (s == '-cp' || s == '--classpath') {
                skipNext = true
                continue
            }
            if (s == '${classpath}') continue
            result.add(prodSubstitutePlaceholders(s, placeholders))
        }
    }
    return result
}

// --- Helper: Collect library files from merged version JSON using install directory ---
ext.prodGetInstallerLibraryFiles = { mergedJson, File installDir ->
    def librariesDir = new File(installDir, 'libraries')
    def files = []
    mergedJson.libraries.each { lib ->
        if (!prodIsLibraryAllowed(lib)) return
        File f = null
        if (lib.downloads?.artifact?.path) {
            f = new File(librariesDir, lib.downloads.artifact.path)
        } else if (lib.name) {
            def path = prodMavenCoordToPath(lib.name)
            f = new File(librariesDir, path)
        }
        if (f != null && f.exists()) files.add(f)
    }
    return files
}

// --- Helper: Directory for prodSmokeTest's per-version server install ---
// Build-relative (not prod_base_dir), so it never collides with a manually
// verified runProd instance and is cleaned up by clean<version>/cleanAll.
ext.prodSmokeTestDir = { String loaderName ->
    file("${layout.buildDirectory.get().asFile}/prod-smoke/${loaderName}-${mcVersion}")
}

// --- Constant: world save directory name used by prodWriteServerConfig's
// server.properties (level-name). Shared with prodResetSmokeTestState so the
// two never drift apart and leave a stale world un-wiped between runs.
ext.PROD_SMOKE_TEST_LEVEL_NAME = 'smoketest'

// --- Helper: Wipe the ephemeral parts of a smoke-test install directory ---
// Keeps the installed server runtime (loader jars/libraries) so re-runs don't
// re-download them, but removes the world/mods/logs so every run creates a
// genuinely fresh world (the world dir name must match level-name below).
ext.prodResetSmokeTestState = { File installDir ->
    [PROD_SMOKE_TEST_LEVEL_NAME, 'mods', 'logs', 'crash-reports'].each { name ->
        def d = new File(installDir, name)
        if (d.exists()) d.deleteDir()
    }
    ['eula.txt', 'server.properties'].each { name ->
        def f = new File(installDir, name)
        if (f.exists()) f.delete()
    }
}

// --- Helper: Write minimal eula.txt / server.properties for a fast smoke test ---
ext.prodWriteServerConfig = { File installDir ->
    new File(installDir, 'eula.txt').text = "eula=true\n"
    new File(installDir, 'server.properties').text = """\
level-name=${PROD_SMOKE_TEST_LEVEL_NAME}
view-distance=2
simulation-distance=2
online-mode=false
gamemode=survival
spawn-protection=0
enable-command-block=false
"""
}

// --- Helper: Run a headless dedicated server and wait for world-creation to finish ---
// Streams the process's stdout/stderr to logFile while watching for a vanilla
// "Done (...)!" readiness line. Sends "stop" and waits briefly once ready;
// throws (failing the task) on timeout or an early exit without that line.
ext.prodRunHeadlessServerSmokeTest = { List<String> command, File workingDir, File logFile, int timeoutSeconds ->
    logFile.parentFile.mkdirs()
    // ProcessBuilder(List) casts to String[] internally; GStrings (from "@${...}"
    // interpolation in callers) fail that cast with an ArrayStoreException, so
    // coerce every element to a real String here regardless of caller.
    def pb = new ProcessBuilder(command.collect { it.toString() })
    pb.directory(workingDir)
    pb.redirectErrorStream(true)
    def process = pb.start()

    def ready = new java.util.concurrent.atomic.AtomicBoolean(false)
    def logWriter = logFile.newPrintWriter()
    def readerThread = Thread.start {
        process.inputStream.eachLine { line ->
            logWriter.println(line)
            logWriter.flush()
            if (line.contains('Done (')) {
                ready.set(true)
            }
        }
    }

    def timedOut = false
    try {
        def deadline = System.currentTimeMillis() + (timeoutSeconds * 1000L)
        while (!ready.get() && process.isAlive() && System.currentTimeMillis() < deadline) {
            Thread.sleep(500)
        }
        timedOut = !ready.get() && process.isAlive()

        if (ready.get()) {
            try {
                process.outputStream.write("stop\n".getBytes())
                process.outputStream.flush()
            } catch (IOException ignored) {
                // Process may have already started shutting down.
            }
        }
    } finally {
        // Always reached, including on Thread.sleep() interruption (e.g. Ctrl+C /
        // daemon cancellation), so the child server JVM never gets orphaned.
        process.waitForOrKill(15000)
        readerThread.join(5000)
        logWriter.close()
    }

    if (!ready.get()) {
        def reason = timedOut
            ? "timed out after ${timeoutSeconds}s waiting for the server to finish loading"
            : "process exited early (exit code ${process.exitValue()}) before finishing world creation"
        throw new GradleException("prodSmokeTest failed: ${reason}. See log: ${logFile}")
    }
}

// ============================================================
// Task: downloadMinecraft
// Downloads vanilla client JAR, libraries, and assets.
// All files are cached in run-prod/cache/.
// ============================================================
tasks.register('downloadMinecraft') {
    group = taskGroupName
    description = "Download vanilla Minecraft client, libraries, and assets for ${mcVersion}"

    doLast {
        def versionJson = prodGetVersionJson(mcVersion)

        // 1. Client JAR
        logger.lifecycle("=== Client JAR ===")
        def clientJar = file("${prodCacheDir}/client/${mcVersion}.jar")
        prodDownloadFile(versionJson.downloads.client.url, clientJar)
        if (clientJar.exists()) {
            logger.lifecycle("  OK: ${clientJar.name}")
        }

        // 2. Libraries (filtered by OS rules)
        logger.lifecycle("=== Libraries ===")
        def librariesDir = file("${prodCacheDir}/libraries")
        def libCount = 0
        versionJson.libraries.each { lib ->
            if (!prodIsLibraryAllowed(lib)) return

            if (lib.downloads?.artifact) {
                def dest = file("${librariesDir}/${lib.downloads.artifact.path}")
                prodDownloadFile(lib.downloads.artifact.url, dest)
                libCount++
            }

            // Native classifier JARs (for MC 1.18.2 and earlier)
            if (lib.natives) {
                def currentOs = prodGetMojangOs()
                def nativeClassifier = lib.natives[currentOs]
                if (nativeClassifier) {
                    // Replace ${arch} placeholder used in some Windows native classifiers
                    nativeClassifier = nativeClassifier.replace('${arch}',
                        System.getProperty('os.arch') == 'aarch64' ? 'arm64' : '64')
                    def nativeArtifact = lib.downloads?.classifiers?.get(nativeClassifier)
                    if (nativeArtifact) {
                        def dest = file("${librariesDir}/${nativeArtifact.path}")
                        prodDownloadFile(nativeArtifact.url, dest)
                    }
                }
            }
        }
        logger.lifecycle("  ${libCount} libraries ready")

        // 3. Assets (index + objects, shared across MC versions with same asset index)
        logger.lifecycle("=== Assets ===")
        def assetsDir = file("${prodCacheDir}/assets")
        def assetIndex = versionJson.assetIndex
        def indexFile = file("${assetsDir}/indexes/${assetIndex.id}.json")
        prodDownloadFile(assetIndex.url, indexFile)

        def objects = new JsonSlurper().parse(indexFile).objects
        def total = objects.size()
        def downloaded = 0
        def skipped = 0
        objects.each { name, obj ->
            def hash = obj.hash
            def prefix = hash.substring(0, 2)
            def dest = file("${assetsDir}/objects/${prefix}/${hash}")
            if (dest.exists()) {
                skipped++
            } else {
                prodDownloadFile("https://resources.download.minecraft.net/${prefix}/${hash}", dest)
                downloaded++
            }
            if ((downloaded + skipped) % 500 == 0) {
                logger.lifecycle("  Assets: ${downloaded + skipped}/${total}")
            }
        }
        logger.lifecycle("  Assets complete: ${total} total (${downloaded} downloaded, ${skipped} cached)")
    }
}

// ============================================================
// Fabric-specific tasks
// ============================================================
if (project.name == 'fabric') {
    configurations {
        prodMods {
            canBeResolved = true
            canBeConsumed = false
            transitive = false
        }
    }

    // --- Task: downloadFabricLoader ---
    // Downloads Fabric Loader and its dependencies (ASM, Mixin, intermediary)
    // using the Fabric Meta API profile.
    tasks.register('downloadFabricLoader') {
        group = taskGroupName
        description = "Download Fabric Loader and dependencies for ${mcVersion}"

        doLast {
            logger.lifecycle("=== Fabric Loader ===")
            def profile = prodGetFabricProfile(mcVersion, project.findProperty('fabric_loader_version'))
            def fabricLibsDir = file("${prodCacheDir}/fabric-loader-libs")

            profile.libraries.each { lib ->
                def path = prodMavenCoordToPath(lib.name)
                def baseUrl = lib.url ?: 'https://libraries.minecraft.net/'
                // Ensure base URL ends with /
                if (!baseUrl.endsWith('/')) baseUrl += '/'
                def dest = file("${fabricLibsDir}/${path}")
                prodDownloadFile("${baseUrl}${path}", dest)
            }
            logger.lifecycle("  ${profile.libraries.size()} Fabric libraries ready")
        }
    }

    // --- Task: setupProdMods ---
    // Copies built mod JAR and dependency mods to the instance mods/ directory.
    tasks.register('setupProdMods') {
        group = taskGroupName
        description = "Copy built mod JAR and dependencies to mods/ for Fabric ${mcVersion}"
        def modJarTaskName = tasks.findByName('transformShadowJar') ? 'transformShadowJar'
            : tasks.findByName('remapJar') ? 'remapJar'
            : tasks.findByName('shadowJar') ? 'shadowJar' : 'jar'
        dependsOn modJarTaskName

        doLast {
            def modsDir = file("${prodBaseDir}/instances/fabric-${mcVersion}/mods")
            if (modsDir.exists()) modsDir.deleteDir()
            modsDir.mkdirs()

            // Built mod JAR
            def modJar = tasks.named(modJarTaskName).get().archiveFile.get().asFile
            ant.copy(file: modJar, todir: modsDir)
            logger.lifecycle("  Mod: ${modJar.name}")

            // Dependency mods (Fabric API, Architectury API)
            configurations.prodMods.files.each { f ->
                ant.copy(file: f, todir: modsDir)
                logger.lifecycle("  Dep: ${f.name}")
            }
        }
    }

    // --- Task: runProd ---
    // Launches Minecraft with built mod in a production-like environment.
    tasks.register('runProd', JavaExec) {
        group = taskGroupName
        description = "Launch Minecraft in production-like environment (Fabric ${mcVersion})"
        dependsOn 'downloadMinecraft', 'downloadFabricLoader', 'setupProdMods'

        doFirst {
            def versionJson = prodGetVersionJson(mcVersion)
            def profile = prodGetFabricProfile(mcVersion, project.findProperty('fabric_loader_version'))
            def instanceDir = file("${prodBaseDir}/instances/fabric-${mcVersion}")
            instanceDir.mkdirs()

            // Build classpath
            def cp = []

            // Fabric Loader and its dependencies (ASM, Mixin, intermediary)
            def fabricLibsDir = file("${prodCacheDir}/fabric-loader-libs")
            // Collect Fabric Loader artifact IDs (group:artifact) to deduplicate against vanilla
            def fabricArtifactIds = [] as Set
            profile.libraries.each { lib ->
                def path = prodMavenCoordToPath(lib.name)
                def f = file("${fabricLibsDir}/${path}")
                if (f.exists()) cp.add(f)
                // Extract group:artifact from Maven coordinate (group:artifact:version[:classifier])
                def parts = lib.name.split(':')
                if (parts.length >= 2) {
                    fabricArtifactIds.add("${parts[0]}:${parts[1]}")
                }
            }

            // Vanilla client JAR
            cp.add(file("${prodCacheDir}/client/${mcVersion}.jar"))

            // Vanilla MC libraries (filtered by OS rules, excluding those already provided by Fabric Loader)
            def vanillaLibs = prodGetLibraryFiles(versionJson)
            vanillaLibs.each { File f ->
                // Check if this vanilla library's artifact is already provided by Fabric Loader
                // by matching the directory structure (group/artifact/version/artifact-version.jar)
                def pathParts = f.absolutePath.replace('\\', '/').split('/')
                def isDuplicate = false
                // Library path ends with: .../group/artifact/version/artifact-version.jar
                // Walk up from filename to find group:artifact
                if (pathParts.length >= 4) {
                    def artifact = pathParts[pathParts.length - 3]
                    def groupParts = []
                    // Find the 'libraries' marker to reconstruct group path
                    def libIdx = -1
                    for (int i = pathParts.length - 4; i >= 0; i--) {
                        if (pathParts[i] == 'libraries') {
                            libIdx = i
                            break
                        }
                    }
                    if (libIdx >= 0) {
                        def group = pathParts[(libIdx + 1)..(pathParts.length - 4)].join('.')
                        isDuplicate = fabricArtifactIds.contains("${group}:${artifact}")
                    }
                }
                if (!isDuplicate) cp.add(f)
            }

            cp = prodPatchLwjglForArm64(cp)
            classpath = files(cp)
            mainClass.set(profile.mainClass)

            // Game arguments
            args '--gameDir', instanceDir.absolutePath
            args '--assetsDir', file("${prodCacheDir}/assets").absolutePath
            args '--assetIndex', versionJson.assetIndex.id
            args '--version', mcVersion
            args '--username', 'Dev'
            args '--accessToken', '0'

        // JVM arguments
        jvmArgs '-Xmx2G', '-Xms512M'
        // Newer Fabric profiles select the Minecraft entrypoint through JVM
        // properties such as -DFabricMcEmu. Without these, Knot puts loader
        // implementation classes in the target class loader.
        jvmArgs(profile.arguments?.jvm ?: [])

        // macOS requires -XstartOnFirstThread for LWJGL/OpenGL
            if (prodGetMojangOs() == 'osx') {
                jvmArgs '-XstartOnFirstThread'
            }

            // Extract native libraries for old MC versions (pre-1.19)
            def nativesDir = new File(instanceDir, "natives")
            nativesDir.mkdirs()
            prodExtractNatives(versionJson, nativesDir)
            jvmArgs "-Djava.library.path=${nativesDir.absolutePath}"

            workingDir = instanceDir

            logger.lifecycle("=== runProd (Fabric ${mcVersion}) ===")
            logger.lifecycle("  Game dir: ${instanceDir}")
            logger.lifecycle("  Classpath entries: ${cp.size()}")
        }
    }

    // --- Task: installFabricServerSmoke ---
    // Installs a real Fabric dedicated-server runtime (fabric-server-launch.jar +
    // vanilla server.jar) into the smoke-test directory. Idempotent: skipped once
    // fabric-server-launch.jar already exists, so re-runs only redo the world/mods.
    tasks.register('installFabricServerSmoke') {
        group = taskGroupName
        description = "Install Fabric dedicated-server runtime for prodSmokeTest (${mcVersion})"
        // No dependsOn downloadMinecraft: the Fabric installer's own
        // -downloadMinecraft flag fetches the server-side jar it needs;
        // this task never reads prodCacheDir's client jar/libraries/assets.

        doLast {
            def installDir = prodSmokeTestDir('fabric')
            def launchJar = new File(installDir, 'fabric-server-launch.jar')
            if (launchJar.exists()) {
                logger.lifecycle("  Fabric server runtime already installed: ${mcVersion}")
                return
            }
            installDir.mkdirs()

            def loaderVersion = project.findProperty('fabric_loader_version')
            def installerVersion = project.findProperty('fabric_installer_version') ?: '1.0.1'
            def installerJar = file("${prodCacheDir}/installers/fabric-installer-${installerVersion}.jar")
            prodDownloadFile(
                "https://maven.fabricmc.net/net/fabricmc/fabric-installer/${installerVersion}/fabric-installer-${installerVersion}.jar",
                installerJar
            )

            logger.lifecycle("=== Installing Fabric dedicated-server runtime (${mcVersion}) ===")
            def launcher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.findProperty('java_version'))
            }.get()
            def process = new ProcessBuilder(
                launcher.executablePath.asFile.absolutePath,
                '-jar', installerJar.absolutePath,
                'server',
                '-mcversion', mcVersion,
                '-loader', loaderVersion,
                '-dir', installDir.absolutePath,
                '-downloadMinecraft'
            ).inheritIO().start()
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("Fabric server installer failed with exit code ${exitCode}")
            }
            if (!launchJar.exists()) {
                throw new GradleException("Fabric server installer did not create fabric-server-launch.jar in: ${installDir}")
            }
            logger.lifecycle("  Fabric server runtime installed successfully")
        }
    }

    // --- Task: prodSmokeTest ---
    // Headless dedicated-server smoke test: installs the built mod into a real
    // Fabric server runtime and confirms a fresh world can be created without
    // crashing. No display required. Recommended after Mixin config changes or
    // when adding a new Minecraft version (see CLAUDE.md).
    tasks.register('prodSmokeTest') {
        group = taskGroupName
        description = "Headless dedicated-server world-creation smoke test (Fabric ${mcVersion})"
        def modJarTaskName = tasks.findByName('transformShadowJar') ? 'transformShadowJar'
            : tasks.findByName('remapJar') ? 'remapJar'
            : tasks.findByName('shadowJar') ? 'shadowJar' : 'jar'
        dependsOn 'installFabricServerSmoke', modJarTaskName

        doLast {
            def installDir = prodSmokeTestDir('fabric')
            prodResetSmokeTestState(installDir)

            def modsDir = new File(installDir, 'mods')
            modsDir.mkdirs()
            def modJar = tasks.named(modJarTaskName).get().archiveFile.get().asFile
            ant.copy(file: modJar, todir: modsDir)
            logger.lifecycle("  Mod: ${modJar.name}")
            configurations.prodMods.files.each { f ->
                ant.copy(file: f, todir: modsDir)
                logger.lifecycle("  Dep: ${f.name}")
            }

            prodWriteServerConfig(installDir)

            def launcher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.findProperty('java_version'))
            }.get()
            def launchJar = new File(installDir, 'fabric-server-launch.jar')
            def command = [
                launcher.executablePath.asFile.absolutePath,
                '-Xmx2G', '-Xms512M',
                '-jar', launchJar.absolutePath,
                'nogui'
            ]
            def logFile = file("${installDir}/smoke-test.log")

            logger.lifecycle("=== prodSmokeTest (Fabric ${mcVersion}) ===")
            logger.lifecycle("  Install dir: ${installDir}")
            prodRunHeadlessServerSmokeTest(command, installDir, logFile, 300)
            logger.lifecycle("  World created successfully. Log: ${logFile}")
        }
    }
}

// ============================================================
// NeoForge-specific tasks
// ============================================================
if (project.name == 'neoforge') {
    configurations {
        prodMods {
            canBeResolved = true
            canBeConsumed = false
            transitive = false
        }
    }

    def neoforgeVersion = project.findProperty('neoforge_version')
    def neoforgeInstallDir = file("${prodCacheDir}/neoforge-install-${mcVersion}")
    def neoforgeVersionId = "neoforge-${neoforgeVersion}"

    // --- Task: installNeoForge ---
    // Downloads NeoForge installer, places vanilla files, runs --installClient.
    tasks.register('installNeoForge') {
        group = taskGroupName
        description = "Install NeoForge ${neoforgeVersion} for ${mcVersion}"
        dependsOn 'downloadMinecraft'

        doLast {
            def versionJsonFile = new File(neoforgeInstallDir,
                "versions/${neoforgeVersionId}/${neoforgeVersionId}.json")
            if (versionJsonFile.exists()) {
                logger.lifecycle("  NeoForge already installed: ${neoforgeVersionId}")
                return
            }

            logger.lifecycle("=== Installing NeoForge ${neoforgeVersion} ===")
            neoforgeInstallDir.mkdirs()

            // Download installer
            def installerJar = file("${prodCacheDir}/installers/neoforge-${neoforgeVersion}-installer.jar")
            prodDownloadFile(
                "https://maven.neoforged.net/releases/net/neoforged/neoforge/${neoforgeVersion}/neoforge-${neoforgeVersion}-installer.jar",
                installerJar
            )

            // Place vanilla files for the installer
            def vanillaVersionDir = new File(neoforgeInstallDir, "versions/${mcVersion}")
            vanillaVersionDir.mkdirs()
            ant.copy(file: file("${prodCacheDir}/versions/${mcVersion}.json"),
                      tofile: new File(vanillaVersionDir, "${mcVersion}.json"),
                      overwrite: false)
            ant.copy(file: file("${prodCacheDir}/client/${mcVersion}.jar"),
                      tofile: new File(vanillaVersionDir, "${mcVersion}.jar"),
                      overwrite: false)

            // Copy vanilla libraries so the installer can find them
            def vanillaLibsDir = file("${prodCacheDir}/libraries")
            if (vanillaLibsDir.exists()) {
                ant.copy(todir: new File(neoforgeInstallDir, "libraries")) {
                    fileset(dir: vanillaLibsDir)
                }
            }

            // Create dummy launcher profile required by the installer
            def profileFile = new File(neoforgeInstallDir, "launcher_profiles.json")
            if (!profileFile.exists()) {
                profileFile.text = '{"profiles":{}}'
            }

            // Run installer
            logger.lifecycle("  Running NeoForge installer...")
            def launcher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.findProperty('java_version'))
            }.get()
            def process = new ProcessBuilder(
                launcher.executablePath.asFile.absolutePath,
                '-jar', installerJar.absolutePath,
                '--installClient', neoforgeInstallDir.absolutePath
            ).inheritIO().start()
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("NeoForge installer failed with exit code ${exitCode}")
            }

            if (!versionJsonFile.exists()) {
                throw new GradleException("NeoForge installer did not create expected version JSON: ${versionJsonFile}")
            }
            logger.lifecycle("  NeoForge installed successfully")
        }
    }

    // --- Task: setupProdMods ---
    // Copies built mod JAR and dependency mods to the instance mods/ directory.
    tasks.register('setupProdMods') {
        group = taskGroupName
        description = "Copy built mod JAR and dependencies to mods/ for NeoForge ${mcVersion}"
        def modJarTaskName = tasks.findByName('transformShadowJar') ? 'transformShadowJar'
            : tasks.findByName('remapJar') ? 'remapJar'
            : tasks.findByName('shadowJar') ? 'shadowJar' : 'jar'
        dependsOn modJarTaskName

        doLast {
            def modsDir = file("${prodBaseDir}/instances/neoforge-${mcVersion}/mods")
            if (modsDir.exists()) modsDir.deleteDir()
            modsDir.mkdirs()

            // Built mod JAR
            def modJar = tasks.named(modJarTaskName).get().archiveFile.get().asFile
            ant.copy(file: modJar, todir: modsDir)
            logger.lifecycle("  Mod: ${modJar.name}")

            // Dependency mods (Architectury API)
            configurations.prodMods.files.each { f ->
                ant.copy(file: f, todir: modsDir)
                logger.lifecycle("  Dep: ${f.name}")
            }
        }
    }

    // --- Task: runProd ---
    // Launches Minecraft with built mod in a production-like environment.
    tasks.register('runProd', JavaExec) {
        group = taskGroupName
        description = "Launch Minecraft in production-like environment (NeoForge ${mcVersion})"
        dependsOn 'downloadMinecraft', 'installNeoForge', 'setupProdMods'

        doFirst {
            def vanillaJson = prodGetVersionJson(mcVersion)
            def loaderJsonFile = new File(neoforgeInstallDir,
                "versions/${neoforgeVersionId}/${neoforgeVersionId}.json")
            def loaderJson = new JsonSlurper().parse(loaderJsonFile)
            def mergedJson = prodMergeVersionJsons(loaderJson, vanillaJson)

            def instanceDir = file("${prodBaseDir}/instances/neoforge-${mcVersion}")
            instanceDir.mkdirs()
            def nativesDir = new File(instanceDir, "natives")
            nativesDir.mkdirs()
            prodExtractNatives(vanillaJson, nativesDir)
            def librariesDir = new File(neoforgeInstallDir, "libraries")

            // Build classpath from installer libraries only.
            // Do NOT add vanilla client JAR — NeoForge uses its own processed client
            // module via the -p (module path) JVM arguments from the version JSON.
            def cp = prodGetInstallerLibraryFiles(mergedJson, neoforgeInstallDir)
            cp = prodPatchLwjglForArm64(cp)
            classpath = files(cp)

            mainClass.set(mergedJson.mainClass)

            // Placeholder substitutions for version JSON arguments
            def placeholders = [
                '${library_directory}'  : librariesDir.absolutePath,
                '${classpath_separator}': File.pathSeparator,
                '${version_name}'       : neoforgeVersionId,
                '${natives_directory}'  : nativesDir.absolutePath,
                '${launcher_name}'      : 'GradleProdRun',
                '${launcher_version}'   : '1.0',
                '${auth_player_name}'   : 'Dev',
                '${version_type}'       : 'release',
                '${game_directory}'     : instanceDir.absolutePath,
                '${assets_root}'        : file("${prodCacheDir}/assets").absolutePath,
                '${assets_index_name}'  : vanillaJson.assetIndex.id,
                '${auth_uuid}'          : '00000000-0000-0000-0000-000000000000',
                '${auth_access_token}'  : '0',
                '${clientid}'           : '0',
                '${auth_xuid}'          : '0',
                '${user_type}'          : 'legacy',
                '${user_properties}'    : '{}',
            ]

            // JVM arguments from version JSON + memory settings
            jvmArgs '-Xmx2G', '-Xms512M'
            jvmArgs prodProcessArguments(mergedJson.arguments.jvm, placeholders)

            // Game arguments from version JSON
            args prodProcessArguments(mergedJson.arguments.game, placeholders)

            workingDir = instanceDir

            logger.lifecycle("=== runProd (NeoForge ${mcVersion}) ===")
            logger.lifecycle("  Game dir: ${instanceDir}")
            logger.lifecycle("  Main class: ${mergedJson.mainClass}")
            logger.lifecycle("  Classpath entries: ${cp.size()}")
        }
    }

    // --- Task: installNeoForgeServerSmoke ---
    // Installs a real NeoForge dedicated-server runtime (via the installer's
    // --installServer mode) into the smoke-test directory. Idempotent: skipped
    // once run.sh already exists, so re-runs only redo the world/mods.
    tasks.register('installNeoForgeServerSmoke') {
        group = taskGroupName
        description = "Install NeoForge dedicated-server runtime for prodSmokeTest (${mcVersion})"
        // No dependsOn downloadMinecraft: --installServer fetches the
        // server-side files it needs itself; this task never reads
        // prodCacheDir's client jar/libraries/assets.

        doLast {
            def installDir = prodSmokeTestDir('neoforge')
            def runScript = new File(installDir, 'run.sh')
            if (runScript.exists()) {
                logger.lifecycle("  NeoForge server runtime already installed: ${mcVersion}")
                return
            }
            installDir.mkdirs()

            def installerJar = file("${prodCacheDir}/installers/neoforge-${neoforgeVersion}-installer.jar")
            prodDownloadFile(
                "https://maven.neoforged.net/releases/net/neoforged/neoforge/${neoforgeVersion}/neoforge-${neoforgeVersion}-installer.jar",
                installerJar
            )

            logger.lifecycle("=== Installing NeoForge dedicated-server runtime (${mcVersion}) ===")
            def launcher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.findProperty('java_version'))
            }.get()
            def process = new ProcessBuilder(
                launcher.executablePath.asFile.absolutePath,
                '-jar', installerJar.absolutePath,
                '--installServer', installDir.absolutePath
            ).inheritIO().start()
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("NeoForge server installer failed with exit code ${exitCode}")
            }
            if (!runScript.exists()) {
                throw new GradleException("NeoForge server installer did not create run.sh in: ${installDir}")
            }
            logger.lifecycle("  NeoForge server runtime installed successfully")
        }
    }

    // --- Task: prodSmokeTest ---
    // Headless dedicated-server smoke test: installs the built mod into a real
    // NeoForge server runtime and confirms a fresh world can be created without
    // crashing. No display required. Recommended after Mixin config changes or
    // when adding a new Minecraft version (see CLAUDE.md).
    tasks.register('prodSmokeTest') {
        group = taskGroupName
        description = "Headless dedicated-server world-creation smoke test (NeoForge ${mcVersion})"
        def modJarTaskName = tasks.findByName('transformShadowJar') ? 'transformShadowJar'
            : tasks.findByName('remapJar') ? 'remapJar'
            : tasks.findByName('shadowJar') ? 'shadowJar' : 'jar'
        dependsOn 'installNeoForgeServerSmoke', modJarTaskName

        doLast {
            def installDir = prodSmokeTestDir('neoforge')
            prodResetSmokeTestState(installDir)

            def modsDir = new File(installDir, 'mods')
            modsDir.mkdirs()
            def modJar = tasks.named(modJarTaskName).get().archiveFile.get().asFile
            ant.copy(file: modJar, todir: modsDir)
            logger.lifecycle("  Mod: ${modJar.name}")
            configurations.prodMods.files.each { f ->
                ant.copy(file: f, todir: modsDir)
                logger.lifecycle("  Dep: ${f.name}")
            }

            prodWriteServerConfig(installDir)

            def launcher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.findProperty('java_version'))
            }.get()

            // The --installServer output provides @-argfiles (user_jvm_args.txt +
            // libraries/.../<neoforgeVersionId>/*unix_args.txt) with paths already
            // resolved relative to installDir; find the unix one for this OS.
            def neoforgeLibDir = new File(installDir, "libraries/net/neoforged/neoforge/${neoforgeVersion}")
            def unixArgsFile = neoforgeLibDir.exists()
                ? neoforgeLibDir.listFiles({ f -> f.name.endsWith('unix_args.txt') } as FileFilter)?.find { true }
                : null
            if (unixArgsFile == null) {
                throw new GradleException("Could not locate NeoForge server unix_args.txt under ${neoforgeLibDir} " +
                    "(installer output layout may differ from what prodSmokeTest expects; inspect ${installDir} manually)")
            }
            def userJvmArgsFile = new File(installDir, 'user_jvm_args.txt')
            def command = [
                launcher.executablePath.asFile.absolutePath,
                '-Xmx2G', '-Xms512M',
                "@${userJvmArgsFile.absolutePath}",
                "@${unixArgsFile.absolutePath}",
                'nogui'
            ]
            def logFile = file("${installDir}/smoke-test.log")

            logger.lifecycle("=== prodSmokeTest (NeoForge ${mcVersion}) ===")
            logger.lifecycle("  Install dir: ${installDir}")
            prodRunHeadlessServerSmokeTest(command, installDir, logFile, 300)
            logger.lifecycle("  World created successfully. Log: ${logFile}")
        }
    }
}

// ============================================================
// Forge-specific tasks
// ============================================================
if (project.name == 'forge') {
    configurations {
        prodMods {
            canBeResolved = true
            canBeConsumed = false
            transitive = false
        }
    }

    def forgeMajorVersion = project.findProperty('forge_major_version') as Integer

    // Forge < 50 (MC 1.20.4 and earlier) is not supported by prod-run.
    // The legacyforge plugin produces Mojang-mapped JARs, but the Forge
    // runtime uses SRG mappings. ForgeWrapper integration was attempted
    // but could not fully replicate the Prism Launcher environment.
    // Use runClient or an external launcher (e.g., Prism Launcher) for testing.
    if (forgeMajorVersion == null || forgeMajorVersion < 50) {
        return
    }

    def forgeVersion = project.findProperty('forge_version')
    def forgeInstallDir = file("${prodCacheDir}/forge-install-${mcVersion}")
    def forgeVersionId = "forge-${forgeVersion}"

    // --- Task: installForge ---
    // Downloads Forge installer, places vanilla files, runs --installClient.
    tasks.register('installForge') {
        group = taskGroupName
        description = "Install Forge ${forgeVersion} for ${mcVersion}"
        dependsOn 'downloadMinecraft'

        doLast {
            def versionJsonFile = prodFindLoaderVersionJson(forgeInstallDir, mcVersion)
            if (versionJsonFile != null) {
                logger.lifecycle("  Forge already installed: ${forgeVersion}")
                return
            }

            logger.lifecycle("=== Installing Forge ${forgeVersion} ===")
            forgeInstallDir.mkdirs()

            // Download installer
            def installerJar = file("${prodCacheDir}/installers/forge-${forgeVersion}-installer.jar")
            prodDownloadFile(
                "https://maven.minecraftforge.net/net/minecraftforge/forge/${forgeVersion}/forge-${forgeVersion}-installer.jar",
                installerJar
            )

            // Place vanilla files for the installer
            def vanillaVersionDir = new File(forgeInstallDir, "versions/${mcVersion}")
            vanillaVersionDir.mkdirs()
            ant.copy(file: file("${prodCacheDir}/versions/${mcVersion}.json"),
                      tofile: new File(vanillaVersionDir, "${mcVersion}.json"),
                      overwrite: false)
            ant.copy(file: file("${prodCacheDir}/client/${mcVersion}.jar"),
                      tofile: new File(vanillaVersionDir, "${mcVersion}.jar"),
                      overwrite: false)

            // Copy vanilla libraries so the installer can find them
            def vanillaLibsDir = file("${prodCacheDir}/libraries")
            if (vanillaLibsDir.exists()) {
                ant.copy(todir: new File(forgeInstallDir, "libraries")) {
                    fileset(dir: vanillaLibsDir)
                }
            }

            // Create dummy launcher profile required by the installer
            def profileFile = new File(forgeInstallDir, "launcher_profiles.json")
            if (!profileFile.exists()) {
                profileFile.text = '{"profiles":{}}'
            }

            // Download ForgeWrapper for legacy Forge (< 50, MC 1.20.4 and earlier)
            if (forgeMajorVersion < 50) {
                def forgeWrapperJar = file("${prodCacheDir}/forgewrapper/ForgeWrapper.jar")
                prodDownloadFile(
                    'https://files.prismlauncher.org/maven/io/github/zekerzhayard/ForgeWrapper/prism-2025-12-07/ForgeWrapper-prism-2025-12-07.jar',
                    forgeWrapperJar
                )
            }

            // Run installer
            logger.lifecycle("  Running Forge installer...")
            def launcher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(project.findProperty('java_version'))
            }.get()
            def process = new ProcessBuilder(
                launcher.executablePath.asFile.absolutePath,
                '-jar', installerJar.absolutePath,
                '--installClient', forgeInstallDir.absolutePath
            ).inheritIO().start()
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("Forge installer failed with exit code ${exitCode}")
            }

            // Verify installation
            versionJsonFile = prodFindLoaderVersionJson(forgeInstallDir, mcVersion)
            if (versionJsonFile == null) {
                throw new GradleException("Forge installer did not create expected version JSON in: ${forgeInstallDir}/versions/")
            }
            logger.lifecycle("  Forge installed successfully")
        }
    }

    // --- Task: setupProdMods ---
    // Copies built mod JAR and dependency mods to the instance mods/ directory.
    tasks.register('setupProdMods') {
        group = taskGroupName
        description = "Copy built mod JAR and dependencies to mods/ for Forge ${mcVersion}"
        def modJarTaskName = tasks.findByName('transformShadowJar') ? 'transformShadowJar'
            : tasks.findByName('remapJar') ? 'remapJar'
            : tasks.findByName('shadowJar') ? 'shadowJar' : 'jar'
        dependsOn modJarTaskName

        doLast {
            def modsDir = file("${prodBaseDir}/instances/forge-${mcVersion}/mods")
            if (modsDir.exists()) modsDir.deleteDir()
            modsDir.mkdirs()

            // Built mod JAR
            def modJar = tasks.named(modJarTaskName).get().archiveFile.get().asFile
            ant.copy(file: modJar, todir: modsDir)
            logger.lifecycle("  Mod: ${modJar.name}")

            // Optional dependency mods
            configurations.prodMods.files.each { f ->
                ant.copy(file: f, todir: modsDir)
                logger.lifecycle("  Dep: ${f.name}")
            }
        }
    }

    // --- Task: runProd ---
    // Launches Minecraft with built mod in a production-like environment.
    tasks.register('runProd', JavaExec) {
        group = taskGroupName
        description = "Launch Minecraft in production-like environment (Forge ${mcVersion})"
        dependsOn 'downloadMinecraft', 'installForge', 'setupProdMods'

        doFirst {
            def vanillaJson = prodGetVersionJson(mcVersion)
            def loaderJsonFile = prodFindLoaderVersionJson(forgeInstallDir, mcVersion)
            def loaderJson = new JsonSlurper().parse(loaderJsonFile)
            def mergedJson = prodMergeVersionJsons(loaderJson, vanillaJson)

            def instanceDir = file("${prodBaseDir}/instances/forge-${mcVersion}")
            instanceDir.mkdirs()
            def nativesDir = new File(instanceDir, "natives")
            nativesDir.mkdirs()
            prodExtractNatives(vanillaJson, nativesDir)
            def librariesDir = new File(forgeInstallDir, "libraries")

            // Build classpath from installer libraries only.
            def cp = prodGetInstallerLibraryFiles(mergedJson, forgeInstallDir)
            cp = prodPatchLwjglForArm64(cp)

            // Legacy Forge (< 50): use ForgeWrapper to handle runtime installation
            if (forgeMajorVersion < 50) {
                def forgeWrapperJar = file("${prodCacheDir}/forgewrapper/ForgeWrapper.jar")
                cp.add(forgeWrapperJar)
                mainClass.set('io.github.zekerzhayard.forgewrapper.installer.Main')
                jvmArgs "-Dforgewrapper.librariesDir=${librariesDir.absolutePath}"
                jvmArgs "-Dforgewrapper.installer=${file("${prodCacheDir}/installers/forge-${forgeVersion}-installer.jar").absolutePath}"
                jvmArgs "-Dforgewrapper.minecraft=${file("${prodCacheDir}/client/${mcVersion}.jar").absolutePath}"
            } else {
                mainClass.set(mergedJson.mainClass)
            }

            classpath = files(cp)

            // Placeholder substitutions for version JSON arguments
            def placeholders = [
                '${library_directory}'  : librariesDir.absolutePath,
                '${classpath_separator}': File.pathSeparator,
                '${version_name}'       : forgeVersionId,
                '${natives_directory}'  : nativesDir.absolutePath,
                '${launcher_name}'      : 'GradleProdRun',
                '${launcher_version}'   : '1.0',
                '${auth_player_name}'   : 'Dev',
                '${version_type}'       : 'release',
                '${game_directory}'     : instanceDir.absolutePath,
                '${assets_root}'        : file("${prodCacheDir}/assets").absolutePath,
                '${assets_index_name}'  : vanillaJson.assetIndex.id,
                '${auth_uuid}'          : '00000000-0000-0000-0000-000000000000',
                '${auth_access_token}'  : '0',
                '${clientid}'           : '0',
                '${auth_xuid}'          : '0',
                '${user_type}'          : 'legacy',
                '${user_properties}'    : '{}',
            ]

            // JVM arguments
            jvmArgs '-Xmx2G', '-Xms512M'
            if (prodGetMojangOs() == 'osx') {
                jvmArgs '-XstartOnFirstThread'
            }
            jvmArgs "-Djava.library.path=${nativesDir.absolutePath}"
            if (forgeMajorVersion >= 50) {
                jvmArgs prodProcessArguments(mergedJson.arguments.jvm, placeholders)
            }

            // Game arguments from version JSON
            args prodProcessArguments(mergedJson.arguments.game, placeholders)

            workingDir = instanceDir

            logger.lifecycle("=== runProd (Forge ${mcVersion}) ===")
            logger.lifecycle("  Game dir: ${instanceDir}")
            logger.lifecycle("  Main class: ${mainClass.get()}")
            logger.lifecycle("  Classpath entries: ${cp.size()}")
        }
    }
}
